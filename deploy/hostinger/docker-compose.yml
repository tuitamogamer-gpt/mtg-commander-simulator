# Commander Live on one VPS: the room server, its Redis, and Caddy for HTTPS.
# Settings come from the .env file beside this one (copy env.example).
#
#   docker compose up -d --build      start or update
#   docker compose ps                 state and health
#   docker compose logs -f live       the room server's log
name: commander-live

services:
  # Room storage. It has no published port: only the room server reaches it.
  # Rooms expire by themselves after 24 hours; the append-only file lets open
  # rooms survive a restart of this container or of the VPS.
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      # A full store refuses new writes; it never drops a room in play.
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  live:
    build:
      context: ../..
      dockerfile: deploy/hostinger/Dockerfile
    environment:
      PORT: "8787"
      # The Redis above, unless REDIS_URL names another one. To keep rooms in
      # PostgreSQL instead, set DATABASE_URL (it takes precedence).
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED:-}
      LIVE_ALLOWED_ORIGINS: ${LIVE_ALLOWED_ORIGINS:?Set LIVE_ALLOWED_ORIGINS in .env to the game page origins}
      LIVE_MAX_CONNECTIONS: ${LIVE_MAX_CONNECTIONS:-400}
    depends_on:
      redis:
        condition: service_healthy
    # Docker forwards SIGTERM; the server tells players to reconnect, stores
    # every seat as away, then exits. Give it time before a hard stop.
    init: true
    stop_grace_period: 20s
    restart: unless-stopped
    logging: *logging

  # HTTPS for LIVE_DOMAIN with a certificate Caddy obtains and renews itself.
  # Ports 80 and 443 must be free on the VPS and open in its firewall.
  caddy:
    image: caddy:2-alpine
    environment:
      LIVE_DOMAIN: ${LIVE_DOMAIN:?Set LIVE_DOMAIN in .env to the room server's hostname}
    ports:
      - "${LIVE_HTTP_PORT:-80}:80"
      - "${LIVE_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - live
    restart: unless-stopped
    logging: *logging

volumes:
  redis-data:
  caddy-data:
  caddy-config:
