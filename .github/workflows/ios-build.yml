name: iOS simulator build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'mobile/**'
      - 'capacitor.config.json'
      - 'scripts/*ios*'
      - 'tests/ios-package.test.mjs'
      - 'package*.json'
      - 'src/**'
      - 'index.html'
      - 'logic.js'
      - '.github/workflows/ios-build.yml'
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ios:sync
      - run: npm run ios:test
      - run: bash scripts/verify-ios-mac.sh
